<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle homepage preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    background: #fff;
    color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    min-height: 100vh;
    padding: 0 24px 10vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .doodle-logo {
    position: relative;
    display: table;
    margin: 0 auto 2.25rem;
    padding-right: .16em;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Avenir Next", sans-serif;
    font-weight: 900;
    font-size: clamp(4.9rem, 12vw, 8.15rem);
    line-height: .92;
    letter-spacing: -.105em;
    white-space: nowrap;
    user-select: none;
    filter: drop-shadow(0 2px 0 rgba(20,20,20,.04));
  }
  .letter {
    position: relative;
    display: inline-block;
    -webkit-text-stroke: .012em rgba(20, 20, 20, .13);
    text-shadow: 0 .035em 0 rgba(20, 20, 20, .08);
  }
  .l1 {color:#4f46e5; transform:rotate(-4deg) translateY(.01em)}
  .l2 {color:#f45b69; transform:rotate(3deg) translateY(-.025em)}
  .l3 {color:#f5a623; transform:rotate(-2deg) translateY(.018em)}
  .l4 {color:#16a085; transform:rotate(3deg) translateY(-.005em)}
  .l5 {color:#8b5cf6; transform:rotate(-3deg) translateY(.025em)}
  .l6 {color:#0ea5e9; transform:rotate(2deg) translateY(-.018em)}
  .spark {
    position:absolute; right:-.08em; top:-.24em; color:#f5a623;
    font-family:Georgia,serif; font-size:.22em; letter-spacing:0; transform:rotate(12deg)
  }
  .doodle-logo::after {
    content:""; display:block; width:73%; height:.11em; margin:.14em auto 0;
    border-top:.055em solid #202124; border-radius:50%; transform:rotate(-1.5deg)
  }
  .search {
    width: min(100%, 730px);
    min-height: 64px;
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 1px 6px rgba(32,33,36,.20);
    transition: .16s ease;
  }
  .search:hover { border-color: transparent; box-shadow: 0 2px 10px rgba(32,33,36,.24); transform: translateY(-1px); }
  input {
    width: 100%; height: 62px; padding: 0 1.7rem; border: 0; outline: 0;
    border-radius: 999px; background: transparent; font-size: 1.08rem; color: #202124;
  }
  input::placeholder { color:#858a91; opacity:1; }
  @media(max-width:640px){
    .doodle-logo{font-size:clamp(4.1rem,22vw,6rem);margin-bottom:1.9rem}
    .search{min-height:58px} input{height:56px;font-size:1rem;padding:0 1.3rem}
  }
</style>
</head>
<body>
<main>
  <div class="doodle-logo" aria-label="Doodle">
    <span class="letter l1">D</span><span class="letter l2">o</span><span class="letter l3">o</span><span class="letter l4">d</span><span class="letter l5">l</span><span class="letter l6">e</span><span class="spark">✦</span>
  </div>
  <div class="search"><input aria-label="Describe a picture to colour" placeholder="What shall we draw?"></div>
</main>
</body>
</html>
